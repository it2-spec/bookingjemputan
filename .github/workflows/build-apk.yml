name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App & Sync Capacitor
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://vbrqodfvazorgipapwoz.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZicnFvZGZ2YXpvcmdpcGFwd296Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNzk5NDUsImV4cCI6MjEwMDg1NTk0NX0.t78tGQkwatd9Fi71ddiSMGZy6pwVTNOyE0lnCwsPIF8' }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY || 'BJh_yoc_KKyQcGt-gUcXq17mSknSSwU0svPa8VmlvsHXXxN7JA4v4RcTMCOPvxPYkMShK7BnJ8lKEPwbJ8zuyQk' }}
        run: |
          npm run build
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRACER-Jemputan-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
